# haps-sx-core.cfg -- haps-openocd target half
# nanoSoC-M0 QuickStart: the core's own CORTEXM0DAP + a cortex_m on AP 0 -- INTRUSIVE, enables halting debug
#
# Copyright (C) 2026, SoC Labs (www.soclabs.org)
#
# Ported from HAPS-work/fpga/haps-sx/openocd/cfg/cortex-m.cfg. Install it with
#
#   haps-openocd save nanosoc-m0-qs-core --from openocd/cfg/haps-sx-core.cfg
#   haps-openocd up   nanosoc-m0-qs-core
#
# The probe half (adapter driver/serial, transport select swd, adapter speed,
# reset_config none, bindto, gdb_port/telnet_port/tcl_port) is written by
# `haps-openocd` on haps-dev and sourced BEFORE this file. Do not repeat any of
# it here, and never pin a gdb port: the tool assigns and forwards them.
#
# DRIFT WARNING. Self-contained by necessity (`save` ships one file). The
# canonical text, with full RTL provenance for every constant, is
# openocd/cfg/nanosoc_m0_qs.cfg in this repo. Change both together.
#
# WHAT THIS ONE COSTS, over haps-sx-mem.cfg: OpenOCD's cortex_m examine WRITES
# DHCSR.C_DEBUGEN and DEMCR.TRCENA at `init` (cortex_m.c ~3003-3015 as of
# 0.12.0+dev-g43441cd; the line numbers move between builds, the behaviour does
# not). The core keeps running, but a BKPT in its code now halts it instead of
# faulting, and a gdb attach halts it -- OpenOCD's default gdb-attach event is
# `halt 1000`. If you only want to look, use haps-sx-mem.cfg.
#
# NO `-expected-id`: inert on cmsis-dap + SWD (OpenOCD 0.12 compares
# expected_ids only in the JTAG chain scan and on HLA/AICE adapters). Compare
# the logged `SWD DPIDR 0x........` line -- expect 0x0bb11477.
#
# NOT `-defer-examine`, unlike the multicore bench's cfg/nanosoc.cfg. That file
# defers because its cores sit behind a system DAP with AHBSLV=0, where a debug
# read of a running core's PPB returns the instruction-fetch stream. This SoC
# has no such stage: AP 0 IS the core's own SLV debug port, so CPUID reads
# correctly from a running core and auto-examine succeeds.
swd newdap nanosoc cpu -enable
dap create nanosoc.dap -chain-position nanosoc.cpu
target create nanosoc.cpu0 cortex_m -endian little -dap nanosoc.dap -ap-num 0
# PMOD2 carries SWCLK/SWDIO/GND/VTref and nothing else, so there is no reset
# wire: the only target reset is SYSRESETREQ through the DAP.
nanosoc.cpu0 cortex_m reset_config sysresetreq
targets nanosoc.cpu0
# nanosoc.cpu0 configure -event gdb-attach {}    ;# attach without halting

# Raw AP reads, for the values a cortex_m examine does not print.
proc qs_rd {addr} {
    nanosoc.dap apreg 0 0x00 0x00000002
    nanosoc.dap apreg 0 0x04 $addr
    return [string trim [nanosoc.dap apreg 0 0x0c]]
}
proc qs_dpidr {} { return [string trim [nanosoc.dap dpreg 0x0]] }
proc qs_ident {} {
    echo "-- nanoSoC-M0 QuickStart identity, AP 0 --"
    echo "DPIDR (live)  [qs_dpidr]   expect 0x0bb11477"
    echo "AP IDR        [string trim [nanosoc.dap apid 0]]   expect 0x04770021"
    echo "AP CFG        [string trim [nanosoc.dap apreg 0 0xf4]]   expect 0x00000000"
    echo "AP BASE       [string trim [nanosoc.dap baseaddr 0]]   0xf0000003 = SoC systable build; 0xe00ff003 = core-ROM-table build"
    nanosoc.dap apreg 0 0x00 0x00000002
    echo "AP CSW        [string trim [nanosoc.dap apreg 0 0x00]]   expect 0x03000042 (0x03000002 = DeviceEn LOW, debug not powered)"
    echo "CPUID         [qs_rd 0xE000ED00]   expect 0x410cc200  (Cortex-M0 r0p0, ECOREVNUM 0)"
    echo "ROM SCS ent   [qs_rd 0xE00FF000]   expect 0xfff0f003"
    echo "DHCSR         [qs_rd 0xE000EDF0]   bit17 S_HALT: 0 = core running, 1 = halted"
}

# Keep a no-result command last: OpenOCD echoes the result of the final
# command in a sourced file, and a bare `proc` returns its own name.
if {0} {}
