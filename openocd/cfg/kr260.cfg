#-----------------------------------------------------------------------------
# kr260.cfg -- nanoSoC-M0 QuickStart on KR260: probe half + targets
#
# Copyright (C) 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------
#   openocd -f openocd/cfg/kr260.cfg
#   openocd -c "set QS_TARGET core" -f openocd/cfg/kr260.cfg
#
# WIRING: THIS REPO DOES NOT SAY. Stated plainly because a guessed pinout is
# worse than none. The KR260 target carries a clock constraint for SWD --
# nanosoc_arch_tech/fpga/fpga/targets/pynq_kr260/fpga_timing.xdc:10,
# `create_clock -name SWCLK -period 60 [get_ports SWCLKTCK]` -- but there is no
# `set_property PACKAGE_PIN ... [get_ports SWCLKTCK]` anywhere in the repo, and
# pynq_kr260/fpga_pinmap.xdc assigns only generic PMOD0_n / PMOD1_n ports. The
# constraint has no pin behind it, so it constrains nothing.
#
# Before this file can connect to anything, somebody must (a) pick two PMOD
# pins, (b) add the PACKAGE_PIN / IOSTANDARD / PULLTYPE lines for swd_clk and
# swd_dio the way pynq-z2 does (nanosoc_m0_soc/pynq/targets/pynq-z2/
# nanosoc.xdc:107-114 is the pattern: PULLDOWN on clk, PULLUP on dio,
# CLOCK_DEDICATED_ROUTE FALSE on the clk net if the pin is not CCIO), and
# (c) write the chosen pins into this comment block. Until then the only honest
# first check on KR260 is the DPIDR line -- see openocd/README.md.
#
# The KR260 PMODs are 3V3 (LVCMOS33, pinmap:9 and on), so a 3V3 probe is
# correct and a 1V8-only probe is not.
#
# Same probe rules as PYNQ-Z2: an ST-Link must land on the dapdirect path, not
# HLA, or `mem_ap` and every `dap` command are unavailable. Check with
# `adapter name`.
#-----------------------------------------------------------------------------

if { ![info exists QS_ADAPTER] } { set QS_ADAPTER interface/cmsis-dap.cfg }
if { ![info exists QS_SPEED]   } { set QS_SPEED 1000 }

source [find $QS_ADAPTER]
transport select swd
adapter speed $QS_SPEED

# No reset wire is defined for this board either.
reset_config none separate

source [file join [file dirname [info script]] nanosoc_m0_qs.cfg]
