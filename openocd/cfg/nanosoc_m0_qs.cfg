#-----------------------------------------------------------------------------
# TARGET HALF ONLY. There is no `adapter`, no `transport`, no `reset_config`
# and no `*_port` command in this file. A board file in this directory writes
# the probe half and sources this one (cfg/pynq-z2.cfg, cfg/kr260.cfg). On
# HAPS-SX the probe half is written by `haps-openocd` and a config that pins a
# port is refused, so that bench gets its own self-contained copies of the two
# target shapes below (cfg/haps-sx-mem.cfg, cfg/haps-sx-core.cfg).
#
# =============================================================================
# What is on the wire
# =============================================================================
# Every value below was read out of RTL. The file:line is given so the claim
# can be re-checked rather than believed. Paths are relative to
# $ARM_QS_IP_DIR (vendor, read-only) or to the repo root.
#
#   SWD --> CORTEXM0DAP, the Cortex-M0's OWN debug access port
#            `-- AP 0: AHB-AP -> the core's SLV debug port
#                               (reaches system memory AND the core's PPB)
#
# There is NO CoreSight SoC-400 SWJ-DP in this SoC, and there is no AP 1.
# Reading AP 1 is therefore a check that must fail (see openocd/README.md).
#
#   SW-DP DPIDR   0x0BB11477  Cortex-M0-logical/cortexm0_dap/verilog/cm0_dap_dp_sw_defs.v:24
#   JTAG-DP DPIDR 0x0BB11477  .../cm0_dap_dp_jtag_defs.v:24
#   JTAG IDCODE   0x0BA01477  .../cm0_dap_dp_jtag_defs.v:23
#   AP 0 IDR      0x04770021  .../cm0_dap_ap_mast_defs.v:28  (JEP106 0x23B,
#                             class 1 MEM-AP, variant 2, type 1 = AHB)
#   AP 0 CFG      0x00000000  .../cm0_dap_ap_mast_defs.v:24  (LE, no LA, no LD)
#   CPUID         0x410CC200  Cortex-M0-logical/cortexm0/verilog/cm0_matrix_sel.v:342
#                             (`32'h410CC200 ^ eco_cpuid`; ECOREVNUM is tied to
#                             zero at both instantiations --
#                             nanosoc_arch_tech/rtl/slcorem0_tech/src/verilog/slcorem0.v:295,381)
#
# The DP is a SW-DP or a JTAG-DP chosen at BUILD time by CORTEXM0DAP's JTAGnSW
# parameter, driven from slcorem0's INCLUDE_JTAG (slcorem0.v:266). It is NOT an
# SWJ-DP: there is no runtime JTAG-to-SWD switch. INCLUDE_JTAG defaults to 0 and
# every FPGA build in this repo leaves it there, so this file is SWD-only. A
# build with INCLUDE_JTAG=1 needs a `jtag newtap` config and this one will not
# connect to it.
#
# OpenOCD still sends its JTAG-to-SWD switch sequence unconditionally
# (adi_v5_swd.c, swd_connect_single). That is harmless here: the sequence ends
# in a 50-clock SWD line reset, and the DPIDR read that follows is the proof it
# did no damage.
#
# -----------------------------------------------------------------------------
# AP 0 BASE -- read it, do not assume it
# -----------------------------------------------------------------------------
# BASEADDR is an input to CORTEXM0DAP, tied externally (CORTEXM0DAP.v:73), from
# slcorem0's ROMTABLE_BASE via `{ROMTABLE_BASE[31:2], 2'd3}` (slcorem0.v:184,294).
#
#   nanosoc_ss_cpu's module default is 0xE00FF003 -- the core's own ROM table
#   (nanosoc_m0_soc/build_soc/rtl/nanosoc_ss_cpu.sv:33), but the SoC top
#   OVERRIDES it: nanosoc.sv:759 passes SYSTABLE_BASE, which is 0xF0000000
#   (nanosoc.sv:54). So the SoC as generated in this repo reads
#
#        AP 0 BASE = 0xF0000003   -> the system ROM table at 0xF0000000
#
#   which is a real, populated target (nanosoc_m0_soc/build_soc/reports/
#   nanosoc_memory_map.txt: `systable  u_region_systable  0xF0000000`), and
#   which matches the CMSDK header's MCU_AP_BASE_VALUE 0xF0000003
#   (nanosoc_arch_tech/firmware/testcodes/generic/config_id.h:36).
#
# Either value is a correct answer for SOME build of this SoC, so `qs_ident`
# prints the one it read and names which build that implies. It does not pass
# or fail on it. A THIRD value is a fail -- see openocd/README.md.
#
# -----------------------------------------------------------------------------
# What the AP can and cannot do (cm0_dap_ap_mast.v)
# -----------------------------------------------------------------------------
#   CSW is almost entirely read-only. Only Size[1:0] (CSW[1:0]) and AddrInc
#   (CSW[4]) are writable (:285,291). Prot is hardwired to 2'b11, CSW[5] is
#   tied 0 so packed transfers do not exist, CSW[2] is tied 0 so the only sizes
#   are byte/halfword/word (:303-312). A CSW readback is therefore
#
#        0x03000042   word size, no auto-increment, DeviceEn HIGH
#        0x03000002   the same with DeviceEn LOW -- debug power/enable is down,
#                     and every memory access will fail
#
#   That 0x03xxxxxx is itself the discriminator: a CoreSight SoC-400 AHB-AP has
#   a writable HPROT and reads back 0x23xxxxxx.
#
#   TAR auto-increment wraps at 1 KB: only tar[9:0] increments (:323-324). Any
#   burst that crosses a 1 KB boundary silently re-reads the same kilobyte.
#
#   AP register byte offsets: CSW 0x00, TAR 0x04, DRW 0x0C, CFG 0xF4,
#   BASE 0xF8, IDR 0xFC (cm0_dap_ap_mast_defs.v:41-49).
#
# =============================================================================
# Knobs
# =============================================================================
#   CHIPNAME    target name prefix                     default `nanosoc`
#   QS_AP       which AP                               default 0 (there is no other)
#   QS_TARGET   `mem` | `core` | `both`                default `mem`
#
# Set them with -c before this file is sourced, e.g.
#   openocd -c "set QS_TARGET core" -f openocd/cfg/pynq-z2.cfg
#
#   mem   ONE `mem_ap` target, `$CHIPNAME.mem`. NOTHING is written to the core.
#         This is the non-disturbing shape: it reads system memory and the PPB
#         (CPUID, DHCSR, the ROM tables) against a freely running core without
#         a `cortex_m` examine and without a single write. Use it to answer
#         "is the design alive and is it the design I think it is".
#
#   core  ONE `cortex_m` target, `$CHIPNAME.cpu0`. This IS disturbing: OpenOCD's
#         cortex_m examine writes DHCSR.C_DEBUGEN and DEMCR.TRCENA at `init`
#         (cortex_m.c ~3003-3015 as of 0.12.0+dev-g43441cd; the line numbers
#         move between builds, the behaviour does not). The core keeps running,
#         but a BKPT in its code now halts it instead of faulting, and a gdb
#         attach halts it (OpenOCD's default gdb-attach event is `halt 1000`).
#
#   both  Both, with the `cortex_m` `-defer-examine` so `init` writes nothing.
#         The current target is left on `$CHIPNAME.mem`. Promote the core when
#         you want it:  `$CHIPNAME.cpu0 arp_examine` -- until then a gdb attach
#         to it is refused with "Target not examined yet".
#-----------------------------------------------------------------------------

if { ![info exists CHIPNAME]  } { set CHIPNAME  nanosoc }
if { ![info exists QS_AP]     } { set QS_AP     0 }
if { ![info exists QS_TARGET] } { set QS_TARGET mem }


# --- 1. Debug port and DAP ---------------------------------------------------
# There is deliberately NO `-expected-id` here, and adding one would be worse
# than useless. Measured from OpenOCD 0.12's source: `expected_ids` is stored by
# jtag/tcl.c and compared only in jtag/core.c (reached solely from
# jtag_examine_chain(), the JTAG chain scan), jtag/hla/hla_interface.c and
# jtag/aice/aice_interface.c. Neither the cmsis-dap+SWD path nor the ST-Link
# dapdirect path is any of those: adi_v5_swd.c reads DP_DPIDR, logs
# `SWD DPIDR 0x........` and compares nothing. A wrong id would connect
# silently, so the guard would prove nothing and would read as if it had.
#
# The DPIDR check that actually runs is in openocd/README.md: read the logged
# line and compare it yourself. `qs_dpidr` below re-reads the register live as
# a second opinion; the log line is the primary evidence because it is what the
# connect itself saw.
swd newdap $CHIPNAME cpu -enable
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu


# --- 2. Targets --------------------------------------------------------------
if { $QS_TARGET eq "mem" } {
    target create $CHIPNAME.mem mem_ap -dap $CHIPNAME.dap -ap-num $QS_AP
    targets $CHIPNAME.mem
} elseif { $QS_TARGET eq "core" } {
    target create $CHIPNAME.cpu0 cortex_m -endian little \
        -dap $CHIPNAME.dap -ap-num $QS_AP
    # The looms on all three boards carry SWCLK/SWDIO/GND/VTref and no reset
    # wire, so the only reset that exists is SYSRESETREQ through the DAP.
    $CHIPNAME.cpu0 cortex_m reset_config sysresetreq
    targets $CHIPNAME.cpu0
} elseif { $QS_TARGET eq "both" } {
    # cortex_m first so it takes the base gdb port.
    target create $CHIPNAME.cpu0 cortex_m -endian little \
        -dap $CHIPNAME.dap -ap-num $QS_AP -defer-examine
    $CHIPNAME.cpu0 cortex_m reset_config sysresetreq
    target create $CHIPNAME.mem mem_ap -dap $CHIPNAME.dap -ap-num $QS_AP
    targets $CHIPNAME.mem
} else {
    error "nanosoc_m0_qs.cfg: QS_TARGET must be mem, core or both (got '$QS_TARGET')"
}


# --- 3. Helper procs for the OpenOCD telnet / tcl shell ----------------------
# All of them drive AP $QS_AP directly with `$CHIPNAME.dap apreg <ap> <reg>
# ?value?`, so they work in all three QS_TARGET modes and never need a target
# to be examined. They print OpenOCD's own `0x%08x` strings verbatim -- what
# you see is what the tool read, not something reformatted on the way out.

# qs_rd ADDR -> one 32-bit word, as `0x........`. Two writes and a read on the
# wire; nothing in the core is modified. CSW 0x00000002 = word size, no
# auto-increment. Only bits [1:0] and [4] of that word land (see above); it is
# written as 0x00000002 rather than the SoC-400 idiom 0x23000002 because the
# Prot bits in the latter are read-only here and writing them would imply
# otherwise.
proc qs_rd {addr} {
    global CHIPNAME QS_AP
    set d $CHIPNAME.dap
    $d apreg $QS_AP 0x00 0x00000002
    $d apreg $QS_AP 0x04 $addr
    return [string trim [$d apreg $QS_AP 0x0c]]
}

# qs_dpidr -> the DPIDR read live from DP register 0x0. A SECOND opinion only:
# the primary evidence is the `SWD DPIDR 0x........` line OpenOCD logged at
# connect, because that is the value the connect itself acted on.
proc qs_dpidr {} {
    global CHIPNAME
    return [string trim [$CHIPNAME.dap dpreg 0x0]]
}

# qs_ident -> the whole identity, one line each, with what each SHOULD say.
# Non-disturbing: every line is a read. Safe against a freely running core.
proc qs_ident {} {
    global CHIPNAME QS_AP
    set d $CHIPNAME.dap
    echo "-- nanoSoC-M0 QuickStart identity, AP $QS_AP --"
    echo "DPIDR (live)  [qs_dpidr]   expect 0x0bb11477"
    echo "AP IDR        [string trim [$d apid $QS_AP]]   expect 0x04770021"
    echo "AP CFG        [string trim [$d apreg $QS_AP 0xf4]]   expect 0x00000000"
    echo "AP BASE       [string trim [$d baseaddr $QS_AP]]   0xf0000003 = SoC systable build; 0xe00ff003 = core-ROM-table build"
    $d apreg $QS_AP 0x00 0x00000002
    echo "AP CSW        [string trim [$d apreg $QS_AP 0x00]]   expect 0x03000042 (0x03000002 = DeviceEn LOW, debug not powered)"
    echo "CPUID         [qs_rd 0xE000ED00]   expect 0x410cc200  (Cortex-M0 r0p0, ECOREVNUM 0)"
    echo "ROM SCS ent   [qs_rd 0xE00FF000]   expect 0xfff0f003"
    echo "ROM CID1      [qs_rd 0xE00FFFF4]   expect 0x00000010  (CoreSight ROM table class)"
    echo "DHCSR         [qs_rd 0xE000EDF0]   bit17 S_HALT: 0 = core running, 1 = halted"
}

# --- The two DISTURBING helpers. Nothing calls them; you do, on purpose. -----
# Halt and resume by writing DHCSR (0xE000EDF0) through the AP, so the core is
# never read to decide to write it. DBGKEY 0xA05F in the top half-word is
# mandatory or the write is dropped.
proc qs_halt {} {
    global CHIPNAME QS_AP
    set d $CHIPNAME.dap
    $d apreg $QS_AP 0x00 0x00000002
    $d apreg $QS_AP 0x04 0xE000EDF0
    $d apreg $QS_AP 0x0c 0xA05F0003   ;# DBGKEY | C_HALT | C_DEBUGEN
    sleep 50
    echo "DHCSR         [qs_rd 0xE000EDF0]   bit17 S_HALT should now be 1"
}
proc qs_resume {} {
    global CHIPNAME QS_AP
    set d $CHIPNAME.dap
    $d apreg $QS_AP 0x00 0x00000002
    $d apreg $QS_AP 0x04 0xE000EDF0
    $d apreg $QS_AP 0x0c 0xA05F0001   ;# DBGKEY | C_DEBUGEN
}

# Keep a no-result command last: OpenOCD echoes the result of the final
# command in a sourced file, and a bare `proc` returns its own name.
if {0} {}
