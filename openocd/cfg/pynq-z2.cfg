#-----------------------------------------------------------------------------
# pynq-z2.cfg -- nanoSoC-M0 QuickStart on PYNQ-Z2: probe half + targets
#
# Copyright (C) 2026, SoC Labs (www.soclabs.org)
#-----------------------------------------------------------------------------
# Run it directly; it sources nanosoc_m0_qs.cfg out of its own directory, so
# no -s is needed and the cwd does not matter:
#
#   openocd -f openocd/cfg/pynq-z2.cfg
#   openocd -c "set QS_TARGET core" -f openocd/cfg/pynq-z2.cfg
#
# WIRING, from nanosoc_m0_soc/pynq/targets/pynq-z2/nanosoc.xdc:19-20,99-114 --
# the 2x3 SPI header:
#
#   pin 1  MISO  W15  swd_dio   PULLUP   -> SWDIO
#   pin 2        3V3            -> VTref / target reference voltage
#   pin 3  SCK   H15  swd_clk   PULLDOWN -> SWCLK
#   pin 6        GND            -> GND
#
# There is NO reset wire on that header, so nSRST does not exist here and the
# only target reset is SYSRESETREQ through the DAP (set in nanosoc_m0_qs.cfg).
#
# PROBE. The repo disagrees with itself about which probe is on the bench:
# nanosoc.xdc:19 documents a SEGGER J-Link, while the older
# nanosoc_m0_soc/pynq/scripts/openocd/nanosoc.cfg:25 defaults to
# interface/stlink.cfg. The default below matches the older config so that
# nothing changes silently for whoever is using it. Override per run:
#
#   openocd -c "set QS_ADAPTER interface/jlink.cfg"    -f openocd/cfg/pynq-z2.cfg
#   openocd -c "set QS_ADAPTER interface/cmsis-dap.cfg" -f openocd/cfg/pynq-z2.cfg
#
# An ST-Link MUST end up on the dapdirect path, not the deprecated HLA one: a
# `mem_ap` target and every `dap` command need a real DAP, and HLA provides
# none. In OpenOCD 0.12 interface/stlink.cfg selects `adapter driver st-link`
# (dapdirect-capable) and bails out if the HLA driver was already chosen.
# Confirm it on your build with `adapter name` -- it must print `st-link`,
# `jlink` or `cmsis-dap`, and never `hla`.
#-----------------------------------------------------------------------------

if { ![info exists QS_ADAPTER] } { set QS_ADAPTER interface/stlink.cfg }
if { ![info exists QS_SPEED]   } { set QS_SPEED 1000 }

source [find $QS_ADAPTER]
transport select swd
adapter speed $QS_SPEED

# No reset wire on the SPI header. `separate` keeps OpenOCD from inventing a
# combined SRST/TRST it cannot drive.
reset_config none separate

source [file join [file dirname [info script]] nanosoc_m0_qs.cfg]
