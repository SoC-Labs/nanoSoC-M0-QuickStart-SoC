# haps-sx-mem.cfg -- haps-openocd target half
# nanoSoC-M0 QuickStart: the core's own CORTEXM0DAP + a mem_ap on AP 0 -- reads only, nothing written to the core
#
# Copyright (C) 2026, SoC Labs (www.soclabs.org)
#
# Ported from HAPS-work/fpga/haps-sx/openocd/cfg/dap-only.cfg, which is the
# prior art for this shape on this bench. Install it with
#
#   haps-openocd save nanosoc-m0-qs-mem --from openocd/cfg/haps-sx-mem.cfg
#   haps-openocd up   nanosoc-m0-qs-mem
#
# `haps-openocd` writes the probe half on haps-dev (adapter driver cmsis-dap,
# adapter serial, transport select swd, adapter speed, reset_config none,
# bindto, gdb_port/telnet_port/tcl_port) and sources this file after it. This
# file therefore declares ONLY the tap, the DAP, the target and helper procs.
# Adding an adapter, transport or port command here is refused twice: by
# `haps-openocd check` before anything is opened, and by the far side at `up`.
#
# DRIFT WARNING. This file is a deliberate self-contained copy: `save` ships a
# single file to haps-dev, so it cannot `source` a sibling. The canonical text
# is openocd/cfg/nanosoc_m0_qs.cfg in this repo -- read that one for the full
# RTL provenance of every constant below, and change both when either changes.
#
# The constants, in short (full file:line citations in nanosoc_m0_qs.cfg):
#   SW-DP DPIDR 0x0BB11477   AP 0 IDR 0x04770021   AP 0 CFG 0x00000000
#   AP 0 BASE   0xF0000003 on the SoC as generated here (system ROM table),
#               0xE00FF003 on a build that leaves ROMTABLE_BASE at the
#               nanosoc_ss_cpu default (core ROM table)
#   CPUID       0x410CC200   CSW readback 0x03000042
#
# NO `-expected-id`. On this bench it is inert: OpenOCD 0.12 compares
# expected_ids only in the JTAG chain scan and on HLA/AICE adapters, never on
# cmsis-dap + SWD, so a wrong value connects and warns of nothing. Compare the
# logged `SWD DPIDR 0x........` line instead -- see openocd/README.md.
#
# This target is the NON-DISTURBING one. It never writes a core register and
# never runs a cortex_m examine, so it is safe against a freely running core.
# Its AP is the core's own SLV debug port, so it reads system memory AND the
# PPB: CPUID at 0xE000ED00 and DHCSR at 0xE000EDF0 both answer here.
swd newdap nanosoc cpu -enable
dap create nanosoc.dap -chain-position nanosoc.cpu
target create nanosoc.mem mem_ap -dap nanosoc.dap -ap-num 0
targets nanosoc.mem

# qs_rd ADDR -> one 32-bit word as `0x........`, read through AP 0.
# CSW 0x00000002 = word size, no auto-increment. Only CSW[1:0] and CSW[4] are
# writable on this AP; Prot is hardwired 2'b11 and packed transfers do not
# exist, so the SoC-400 idiom 0x23000002 is not used here.
proc qs_rd {addr} {
    nanosoc.dap apreg 0 0x00 0x00000002
    nanosoc.dap apreg 0 0x04 $addr
    return [string trim [nanosoc.dap apreg 0 0x0c]]
}

# qs_dpidr -> DPIDR read live from DP register 0x0. A second opinion; the
# logged line at connect is the primary evidence.
proc qs_dpidr {} { return [string trim [nanosoc.dap dpreg 0x0]] }

# qs_ident -> the identity, one line each, with what each should say.
proc qs_ident {} {
    echo "-- nanoSoC-M0 QuickStart identity, AP 0 --"
    echo "DPIDR (live)  [qs_dpidr]   expect 0x0bb11477"
    echo "AP IDR        [string trim [nanosoc.dap apid 0]]   expect 0x04770021"
    echo "AP CFG        [string trim [nanosoc.dap apreg 0 0xf4]]   expect 0x00000000"
    echo "AP BASE       [string trim [nanosoc.dap baseaddr 0]]   0xf0000003 = SoC systable build; 0xe00ff003 = core-ROM-table build"
    nanosoc.dap apreg 0 0x00 0x00000002
    echo "AP CSW        [string trim [nanosoc.dap apreg 0 0x00]]   expect 0x03000042 (0x03000002 = DeviceEn LOW, debug not powered)"
    echo "CPUID         [qs_rd 0xE000ED00]   expect 0x410cc200  (Cortex-M0 r0p0, ECOREVNUM 0)"
    echo "ROM SCS ent   [qs_rd 0xE00FF000]   expect 0xfff0f003"
    echo "ROM CID1      [qs_rd 0xE00FFFF4]   expect 0x00000010  (CoreSight ROM table class)"
    echo "DHCSR         [qs_rd 0xE000EDF0]   bit17 S_HALT: 0 = core running, 1 = halted"
}

# Keep a no-result command last: OpenOCD echoes the result of the final
# command in a sourced file, and a bare `proc` returns its own name.
if {0} {}
